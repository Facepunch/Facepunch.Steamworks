name: Build All

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest
    
    steps:
    # v5 of these actions runs on Node 24. The v4 pins were being force-migrated off the
    # deprecated Node 20 runtime and warning on every run.
    - uses: actions/checkout@v5
    # 6.0.x builds the library's net6.0 target framework.
    # 8.0.x is needed by Tools/Steamworks.Conformance and Tools/Steamworks.LayoutBaseline,
    # both of which target net8.0.
    #
    # No 'include-prerelease' here: setup-dotnet dropped that input, and passing it made
    # every run warn "Unexpected input(s) 'include-prerelease'". Use 'dotnet-quality' if a
    # prerelease is ever genuinely needed.
    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
          dotnet-version: |
            6.0.x
            8.0.x

    - name: Restore Win32
      run: dotnet restore Facepunch.Steamworks\Facepunch.Steamworks.Win32.csproj
    - name: Restore Posix
      run: dotnet restore Facepunch.Steamworks\Facepunch.Steamworks.Posix.csproj
    - name: Restore Win64
      run: dotnet restore Facepunch.Steamworks\Facepunch.Steamworks.Win64.csproj
      
    - name: Build Win32
      run: dotnet build Facepunch.Steamworks\Facepunch.Steamworks.Win32.csproj
    - name: Build Posix
      run: dotnet build Facepunch.Steamworks\Facepunch.Steamworks.Posix.csproj
    - name: Build Win64
      run: dotnet build Facepunch.Steamworks\Facepunch.Steamworks.Win64.csproj
      
    - name: Build Win32 Release
      run: dotnet build Facepunch.Steamworks\Facepunch.Steamworks.Win32.csproj --configuration Release
    - name: Build Posix Release
      run: dotnet build Facepunch.Steamworks\Facepunch.Steamworks.Posix.csproj --configuration Release
    - name: Build Win64 Release
      run: dotnet build Facepunch.Steamworks\Facepunch.Steamworks.Win64.csproj --configuration Release

    # Asserts that every DllImport entry point in the built assemblies actually exists in
    # every committed Steamworks binary (Windows, Linux and macOS). Entry points are plain
    # strings the compiler never checks, so without this a symbol Valve removed - or a
    # stale committed binary - ships silently and throws EntryPointNotFoundException on a
    # player's machine. Needs no Steam client, account or network.
    - name: Verify native export conformance
      run: powershell -ExecutionPolicy Bypass -File verify-native-conformance.ps1

    # Pins the marshalled layout (size, pack, field offsets) of all 339 structs. Steam
    # writes these directly into memory we read back, so a layout mismatch silently
    # returns wrong data or reads past the buffer instead of throwing. The layouts come
    # from the code generator, where one small change can re-lay-out dozens of structs at
    # once - this makes that surface as a reviewable diff. Needs no Steam client.
    - name: Verify struct layout baseline
      run: powershell -ExecutionPolicy Bypass -File verify-struct-layout.ps1

    - uses: actions/upload-artifact@v7
      with:
        name: Compiled Files
        path: Facepunch.Steamworks/bin
